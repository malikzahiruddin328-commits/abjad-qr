<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Baba Ji</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #f5f3f0, #faf8f6);
            color: #2c2c2c;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            border: 1px solid #e0d8d0;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a3a52;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a3a52;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0d8d0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            color: #2c2c2c;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #c85a3a;
            box-shadow: 0 0 0 3px rgba(200, 90, 58, 0.1);
        }

        button {
            width: 100%;
            background: #c85a3a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #a84628;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #1a3a52;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐 Baba Ji</div>
        <div class="subtitle">Admin Access</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
            </div>

            <button type="submit">Login</button>

            <div class="error" id="error"></div>
        </form>

        <a href="baba-ji-lobby-mockups.html" class="back-link">← Back to Lobby</a>
    </div>

    <script>
        const SESSION_KEY = 'babaJiAdminSession';
        const SESSION_EXPIRY = 8 * 60 * 60 * 1000; // 8 hours max for admin access
        const RATE_LIMIT_KEY = 'babaJiAdminAttempts';
        const LOCKOUT_DURATION = 15 * 60 * 1000; // 15 minutes

        const storage = (() => {
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                return localStorage;
            } catch (e) {
                return sessionStorage;
            }
        })();

        // Rate limiting
        function getAttempts() {
            try {
                const data = JSON.parse(storage.getItem(RATE_LIMIT_KEY) || '{}');
                if (data.lockedUntil && Date.now() < data.lockedUntil) {
                    return { attempts: 5, lockedUntil: data.lockedUntil, locked: true };
                }
                return { attempts: data.attempts || 0, locked: false };
            } catch (e) {
                return { attempts: 0, locked: false };
            }
        }

        function recordFailedAttempt() {
            try {
                const current = getAttempts();
                const newAttempts = current.attempts + 1;
                storage.setItem(RATE_LIMIT_KEY, JSON.stringify({
                    attempts: newAttempts,
                    lockedUntil: newAttempts >= 5 ? Date.now() + LOCKOUT_DURATION : null,
                    lastAttempt: Date.now()
                }));
            } catch (e) {
                console.error('Failed to record attempt:', e);
            }
        }

        function clearAttempts() {
            try {
                storage.removeItem(RATE_LIMIT_KEY);
            } catch (e) {
                console.error('Failed to clear attempts:', e);
            }
        }

        function checkSession() {
            try {
                const session = storage.getItem(SESSION_KEY);
                if (session) {
                    const { expiry } = JSON.parse(session);
                    if (Date.now() < expiry) {
                        window.location.href = 'admin.html';
                    } else {
                        storage.removeItem(SESSION_KEY);
                    }
                }
            } catch (e) {
                console.error('Session check failed:', e);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            const { attempts, locked, lockedUntil } = getAttempts();

            if (locked) {
                const minRemaining = Math.ceil((lockedUntil - Date.now()) / 60000);
                errorEl.textContent = `Too many failed attempts. Please try again in ${minRemaining} minute(s).`;
                errorEl.classList.add('show');
                document.getElementById('password').disabled = true;
                document.querySelector('button[type="submit"]').disabled = true;
                return;
            }

            const adminPasswordConfig = window.BABA_JI_CONFIG?.adminPassword || null;

            if (!adminPasswordConfig) {
                errorEl.textContent = 'Admin access not configured. Contact your administrator.';
                errorEl.classList.add('show');
                return;
            }

            if (password === adminPasswordConfig) {
                try {
                    clearAttempts();
                    storage.setItem(SESSION_KEY, JSON.stringify({
                        loggedIn: true,
                        expiry: Date.now() + SESSION_EXPIRY
                    }));
                    window.location.href = 'admin.html';
                } catch (e) {
                    errorEl.textContent = 'Session storage error. Please try again.';
                    errorEl.classList.add('show');
                    console.error('Session creation failed:', e);
                }
            } else {
                recordFailedAttempt();
                const { attempts: newAttempts } = getAttempts();
                errorEl.textContent = `Incorrect password. (${newAttempts}/5 attempts)`;
                errorEl.classList.add('show');
                document.getElementById('password').value = '';
            }
        });

        checkSession();
    </script>
</body>
</html>
