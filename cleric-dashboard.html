<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleric Dashboard — Baba Ji</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #f5f3f0, #faf8f6);
            color: #2c2c2c;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        header {
            background: white;
            padding: 16px 40px;
            border-bottom: 1px solid #e0d8d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a3a52;
        }

        nav {
            display: flex;
            gap: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        nav a {
            color: #555;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #1a3a52;
        }

        .logout-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .wrap {
            max-width: 1060px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .container {
            background: white;
            border-radius: 8px;
            padding: 40px;
            border: 1px solid #e0d8d0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Lora', serif;
            font-size: 2rem;
            color: #1a3a52;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            color: #1a3a52;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0d8d0;
            padding-bottom: 12px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .profile-field {
            padding: 16px;
            background: #f9f7f5;
            border-radius: 6px;
        }

        .profile-field label {
            display: block;
            font-weight: 600;
            color: #1a3a52;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .profile-field value {
            display: block;
            color: #2c2c2c;
            font-size: 1rem;
            margin-top: 4px;
        }

        .availability-list {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .availability-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f7f5;
            border-radius: 6px;
            border-left: 3px solid #c85a3a;
        }

        .slot-time {
            font-weight: 600;
            color: #1a3a52;
        }

        .slot-status {
            font-size: 0.85rem;
            color: #888;
        }

        .remove-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .remove-btn:hover {
            background: #b71c1c;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a3a52;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0d8d0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            color: #2c2c2c;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #c85a3a;
            box-shadow: 0 0 0 3px rgba(200, 90, 58, 0.1);
        }

        button {
            background: #c85a3a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #a84628;
        }

        .empty {
            color: #888;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 3px solid #4caf50;
            display: block;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 3px solid #f44336;
            display: block;
        }

        @media (max-width: 768px) {
            .profile-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Baba Ji</div>
        <nav>
            <a href="baba-ji-lobby-mockups.html">Back to Lobby</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="wrap">
        <div class="container">
            <h1>👤 Cleric Dashboard</h1>
            <p class="subtitle">Manage your profile, rates, and availability</p>

            <div class="section">
                <h2>Your Profile</h2>
                <div class="profile-info">
                    <div class="profile-field">
                        <label>Name</label>
                        <value id="profileName"></value>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <value id="profileEmail"></value>
                    </div>
                    <div class="profile-field">
                        <label>Specialty</label>
                        <value id="profileSpecialty"></value>
                    </div>
                    <div class="profile-field">
                        <label>Hourly Rate</label>
                        <value id="profileRate"></value>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>⏰ Your Availability</h2>
                <div id="availabilityMessage" class="message"></div>
                <div class="availability-list" id="availabilityList"></div>

                <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid #e0d8d0;">
                    <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #1a3a52;">Add Available Slot</h3>
                    <div class="form-group">
                        <label for="availDay">Day</label>
                        <select id="availDay" required>
                            <option value="">Select a day</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="availStartTime">Start Time (24h)</label>
                        <input type="time" id="availStartTime" required>
                    </div>

                    <div class="form-group">
                        <label for="availEndTime">End Time (24h)</label>
                        <input type="time" id="availEndTime" required>
                    </div>

                    <button onclick="addAvailability()">Add Availability Slot</button>
                </div>
            </div>

            <div class="section">
                <h2>📊 Your Bookings</h2>
                <div id="bookingsList"></div>
            </div>
        </div>
    </div>

    <script src="services-availability.js"></script>
    <script src="services-database.js"></script>

    <script>
        const CLERIC_SESSION_KEY = 'babaJiClericSession';
        const CLERICS_KEY = 'babaJiClerics';
        const BOOKINGS_KEY = 'babaJiBookings';

        // Map day names to day of week (0=Sunday, 1=Monday, etc.)
        const DAY_MAP = {
            'Sunday': 0,
            'Monday': 1,
            'Tuesday': 2,
            'Wednesday': 3,
            'Thursday': 4,
            'Friday': 5,
            'Saturday': 6
        };

        // Try localStorage first, fall back to sessionStorage
        const storage = (() => {
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                return localStorage;
            } catch (e) {
                return sessionStorage;
            }
        })();

        let currentCleric = null;

        function checkSession() {
            try {
                const session = storage.getItem(CLERIC_SESSION_KEY);
                if (!session) {
                    window.location.href = 'cleric-login.html';
                    return false;
                }

                const { expiry } = JSON.parse(session);
                if (Date.now() >= expiry) {
                    storage.removeItem(CLERIC_SESSION_KEY);
                    window.location.href = 'cleric-login.html';
                    return false;
                }
                return true;
            } catch (e) {
                window.location.href = 'cleric-login.html';
                return false;
            }
        }

        function getCurrentCleric() {
            try {
                const session = JSON.parse(storage.getItem(CLERIC_SESSION_KEY));
                if (session && session.id) {
                    const clerics = JSON.parse(storage.getItem(CLERICS_KEY)) || [];
                    return clerics.find(c => c.id === session.id);
                }
            } catch (e) {
                console.error('Failed to get current cleric:', e);
            }
            return null;
        }

        function logout() {
            storage.removeItem(CLERIC_SESSION_KEY);
            window.location.href = 'baba-ji-lobby-mockups.html';
        }

        function displayProfile() {
            if (!currentCleric) return;

            document.getElementById('profileName').textContent = currentCleric.name;
            document.getElementById('profileEmail').textContent = currentCleric.email;
            document.getElementById('profileSpecialty').textContent = currentCleric.specialty;
            document.getElementById('profileRate').textContent = `$${currentCleric.rate}/hour`;
        }

        function displayAvailability() {
            const list = document.getElementById('availabilityList');
            const availability = currentCleric.availability || [];

            if (availability.length === 0) {
                list.innerHTML = '<div class="empty">No availability slots set yet. Add one to get started!</div>';
                return;
            }

            list.innerHTML = availability.map((slot, idx) => `
                <div class="availability-slot">
                    <div>
                        <div class="slot-time">${slot.day} • ${slot.startTime} - ${slot.endTime}</div>
                    </div>
                    <button class="remove-btn" onclick="removeAvailability(${idx})">Remove</button>
                </div>
            `).join('');
        }

        function addAvailability() {
            const day = document.getElementById('availDay').value;
            const startTime = document.getElementById('availStartTime').value;
            const endTime = document.getElementById('availEndTime').value;

            if (!day || !startTime || !endTime) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            if (startTime >= endTime) {
                showMessage('End time must be after start time', 'error');
                return;
            }

            try {
                // Save to availability service (supports database)
                const dayOfWeek = DAY_MAP[day];
                setAvailability(currentCleric.id, dayOfWeek, startTime, endTime);

                // Also save to local cleric profile for backward compatibility
                const clerics = JSON.parse(storage.getItem(CLERICS_KEY)) || [];
                const clericIdx = clerics.findIndex(c => c.id === currentCleric.id);

                if (clericIdx !== -1) {
                    if (!clerics[clericIdx].availability) {
                        clerics[clericIdx].availability = [];
                    }
                    clerics[clericIdx].availability.push({ day, startTime, endTime });
                    storage.setItem(CLERICS_KEY, JSON.stringify(clerics));
                    currentCleric = clerics[clericIdx];
                }

                displayAvailability();
                showMessage('✓ Availability slot added!', 'success');

                document.getElementById('availDay').value = '';
                document.getElementById('availStartTime').value = '';
                document.getElementById('availEndTime').value = '';
            } catch (error) {
                console.error('Failed to add availability:', error);
                showMessage('Error saving availability', 'error');
            }
        }

        function removeAvailability(idx) {
            try {
                const clerics = JSON.parse(storage.getItem(CLERICS_KEY)) || [];
                const clericIdx = clerics.findIndex(c => c.id === currentCleric.id);

                if (clericIdx !== -1 && clerics[clericIdx].availability) {
                    const removed = clerics[clericIdx].availability.splice(idx, 1)[0];
                    storage.setItem(CLERICS_KEY, JSON.stringify(clerics));
                    currentCleric = clerics[clericIdx];

                    // Also remove from availability service
                    if (removed) {
                        const dayOfWeek = DAY_MAP[removed.day];
                        // Find and remove from availability storage
                        const availability = JSON.parse(localStorage.getItem('babaJiAvailability') || '[]');
                        const newAvailability = availability.filter(a =>
                            !(a.clericId === currentCleric.id &&
                              a.dayOfWeek === dayOfWeek &&
                              a.startTime === removed.startTime &&
                              a.endTime === removed.endTime)
                        );
                        localStorage.setItem('babaJiAvailability', JSON.stringify(newAvailability));
                    }

                    displayAvailability();
                    showMessage('✓ Availability slot removed', 'success');
                }
            } catch (error) {
                console.error('Failed to remove availability:', error);
                showMessage('Error removing availability', 'error');
            }
        }

        function displayBookings() {
            const list = document.getElementById('bookingsList');
            const bookings = JSON.parse(storage.getItem(BOOKINGS_KEY)) || [];
            const myBookings = bookings.filter(b => b.cleric === currentCleric.name);

            if (myBookings.length === 0) {
                list.innerHTML = '<div class="empty">No bookings yet. You\'ll see them here when people book your sessions.</div>';
                return;
            }

            list.innerHTML = myBookings.map(booking => `
                <div style="padding: 16px; background: #f9f7f5; border-radius: 6px; border-left: 3px solid #d4a574; margin-bottom: 12px;">
                    <div style="font-weight: 600; color: #1a3a52; margin-bottom: 4px;">${booking.date} • ${booking.time}</div>
                    <div style="font-size: 0.9rem; color: #555; margin-bottom: 4px;">Duration: ${booking.duration} minutes</div>
                    <div style="font-size: 0.85rem; color: #888;">Topic: ${booking.topic}</div>
                    <div style="font-size: 0.85rem; color: #888; margin-top: 4px;">Rate: $${booking.rate}/hour</div>
                </div>
            `).join('');
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('availabilityMessage');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 3000);
        }

        // Initialize
        if (checkSession()) {
            currentCleric = getCurrentCleric();
            if (currentCleric) {
                displayProfile();
                displayAvailability();
                displayBookings();
            } else {
                window.location.href = 'cleric-login.html';
            }
        }
    </script>
</body>
</html>
