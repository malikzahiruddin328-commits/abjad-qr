ta.addEventListener("input", render);

$("scriptSwitch").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  ta.style.fontFamily = b.dataset.font==="naskh"
    ? "'Amiri','Noto Naskh Arabic',serif"
    : "'Noto Nastaliq Urdu','Amiri',serif";
});

$("rtlBtn").addEventListener("click",()=>{
  const rtl = ta.getAttribute("dir")!=="ltr";
  ta.setAttribute("dir", rtl?"ltr":"rtl");
  // The stylesheet sets `textarea{direction:rtl}`, which outranks the dir
  // attribute — so setting the attribute alone moved the alignment but never
  // the actual text direction. Set it inline too, or the button is half dead.
  ta.style.direction = rtl?"ltr":"rtl";
  ta.style.textAlign = rtl?"left":"right";
});
$("clearBtn").addEventListener("click",()=>{ ta.value=""; render(); ta.focus(); });
$("kbBtn").addEventListener("click",()=>{
  const kb = $("keyboard");
  kb.style.display = kb.style.display==="none" ? "block" : "none";
});

$("dlPng").addEventListener("click",()=>{
  if(!lastPayload){ return; }
  const a = document.createElement("a");
  a.href = $("qrcanvas").toDataURL("image/png");
  a.download = "abjad-qr.png";
  a.click();
});
$("copyQr").addEventListener("click",async()=>{
  if(!lastPayload) return;
  try{ await navigator.clipboard.writeText(lastPayload);
    $("copyQr").textContent=T().copied; setTimeout(()=>$("copyQr").textContent=T().btnCopy,1200);
  }catch(e){ alert(T().copyFail+"\n\n"+lastPayload); }
});

/* ================= LIBRARY =================
   The library is a PICKER, not a calculator. It never computes anything:
   selecting texts writes Arabic into the textarea above and calls render(),
   so every number and the QR come out of analyze() — the one engine. */

$("lb").innerHTML=Object.keys(L).map(function(k){
  return '<button class="lg" type="button" data-l="'+k+'" aria-pressed="'+(k==='en')+'">'+esc(L[k].lab)+'</button>';
}).join('');

$("g").innerHTML=NAMES.map(function(x){
  return '<button class="c" type="button" aria-pressed="false" data-id="'+x.id+'">'+
    '<span class="num">'+esc(x.id.slice(1))+'</span><span class="ar">'+x.ar+'</span>'+
    '<span class="tl">'+esc(x.tl)+'</span><span class="mn">'+esc(x.mn.slice(0,58))+'</span>'+
    '<span class="v">'+(x.v===null?'':x.v.toLocaleString())+'</span></button>';
}).join('');
$("c1").textContent='('+NAMES.length+')';
$("c2").textContent='('+OTHERS.length+')';

function rowHtml(x){
  var tags=[x.bk,x.cat].filter(Boolean).map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join('');
  var right=x.pend?'<span class="pendtag">'+esc(T().pendTag)+'</span>'
    :'<b>'+x.v.toLocaleString()+'</b><small>'+esc(T().abjadLab)+'</small>';
  var head=[esc(x.ti),x.ref?('&middot; '+esc(x.ref)):''].filter(Boolean).join(' ');
  return '<button class="r'+(x.pend?' pend':'')+'" type="button" aria-pressed="false" data-id="'+x.id+'"'+
    (x.pend?' aria-disabled="true"':'')+'><span>'+
    (x.ar?'<span class="rar">'+x.ar+'</span>':'')+
    '<span class="rti">'+head+'</span>'+
    (x.mn?'<span class="rmn">'+esc(x.mn.slice(0,150))+'</span>':'')+
    '<span class="tags">'+tags+'</span></span><span class="rv">'+right+'</span></button>';
}

/* free-text search across every field, with * as a wildcard */
function matcher(f){
  if(f.indexOf('*')<0) return function(h){return h.indexOf(f)>=0};
  var rx=new RegExp(f.split('*').map(function(p){
    return p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }).join('[\\s\\S]*'));
  return function(h){return rx.test(h)};
}
function renderList(){
  var f=($("q").value||'').trim().toLowerCase();
  var test=f?matcher(f):null;
  var hits=OTHERS.filter(function(x){
    if(!f)return true;
    return test((x.ti+' '+x.mn+' '+x.pu+' '+x.cat+' '+x.tl+' '+x.ref+' '+x.bk).toLowerCase());
  });
  $("l").innerHTML=hits.length?hits.map(rowHtml).join('')
    :'<div class="none">'+esc(T().none)+'</div>';
  $("hits").textContent=f
    ? hits.length+' '+(hits.length===1?T().match1:T().matchN)+' \u201c'+f+'\u201d'
    : OTHERS.length+' '+T().texts;
  sel.forEach(function(id){var el=document.querySelector('#l .r[data-id="'+id+'"]');if(el)el.setAttribute('aria-pressed','true')});
}

function drawSel(){
  var items=sel.map(function(id){return ALL[id]}).filter(Boolean);
  var t=T();
  $("chain").textContent=items.map(function(x){return x.ar}).join(' ');
  if(!items.length){
    $("chain").innerHTML='<span class="empty">'+esc(t.emptySel)+'</span>';
    $("cnt").textContent=t.nothing;
    $("selchips").innerHTML='';
    $("sendBtn").disabled=true;
    return;
  }
  $("cnt").textContent=items.length===1?t.item1:(items.length+' '+t.itemN);
  $("selchips").innerHTML=items.map(function(x){
    return '<span class="selchip">'+esc(x.ti)+'<button type="button" data-drop="'+x.id+'" aria-label="remove">\u00d7</button></span>';
  }).join('');
  $("sendBtn").disabled=false;
}

function toggle(el){
  var id=el.dataset.id,x=ALL[id];if(!x||x.pend)return;
  var i=sel.indexOf(id);
  if(i>=0){sel.splice(i,1);el.setAttribute('aria-pressed','false')}
  else{sel.push(id);el.setAttribute('aria-pressed','true')}
  drawSel();
}
function drop(id){
  var i=sel.indexOf(id); if(i<0) return;
  sel.splice(i,1);
  var el=document.querySelector('#library [data-id="'+id+'"]'); if(el)el.setAttribute('aria-pressed','false');
  drawSel();
}

var sentTimer=null;
function sendToCalc(){
  var items=sel.map(function(id){return ALL[id]}).filter(function(x){return x&&x.ar});
  if(!items.length) return;
  ta.value=items.map(function(x){return x.ar}).join(' ');
  render();                                   /* the one and only engine path */
  $("calc").scrollIntoView({behavior:'smooth',block:'start'});
  ta.focus({preventScroll:true});
  var m=$("sentMsg"); m.textContent=T().sentMsg; m.hidden=false;
  if(sentTimer) clearTimeout(sentTimer);
  sentTimer=setTimeout(function(){m.hidden=true},5000);
}

$("g").addEventListener('click',function(e){var c=e.target.closest('.c');if(c)toggle(c)});
$("l").addEventListener('click',function(e){var r=e.target.closest('.r');if(r)toggle(r)});
$("selchips").addEventListener('click',function(e){var b=e.target.closest('[data-drop]');if(b)drop(b.dataset.drop)});
$("q").addEventListener('input',renderList);
$("sendBtn").addEventListener('click',sendToCalc);
$("clr").addEventListener('click',function(){
  sel=[];Array.prototype.forEach.call(document.querySelectorAll('#library [aria-pressed="true"]'),function(c){
    c.setAttribute('aria-pressed','false')});
  drawSel();
});
function show(n){
  $("t1").setAttribute('aria-selected',n===1?'true':'false');
  $("t2").setAttribute('aria-selected',n===2?'true':'false');
  $("p1").hidden=(n!==1);$("p2").hidden=(n!==2);
}
$("t1").addEventListener('click',function(){show(1)});
$("t2").addEventListener('click',function(){show(2)});

/* ---------- Language ---------- */
function setText(id,v){var e=$(id);if(e)e.textContent=v}
function applyLang(k){
  lang=k;var t=T();
  document.body.setAttribute('dir',t.dir);
  document.body.setAttribute('data-lang',k);
  document.documentElement.setAttribute('lang',k);
  document.documentElement.setAttribute('dir',t.dir);
  document.title=t.docTitle;

  setText('eye',t.eye); setText('h1',t.h1); setText('sub',t.sub);
  setText('inH',t.inH); setText('inHint',t.inHint);
  setText('clearBtn',t.btnClear); setText('kbBtn',t.btnKb);
  setText('qrH',t.qrH); setText('dlPng',t.btnDl); setText('copyQr',t.btnCopy);
  setText('qrWhat',t.qrWhat); setText('qrWhatP',t.qrWhatP);
  setText('abjadH',t.abjadH); setText('grandLab',t.grandLab);
  setText('wordLab',t.wordLab); setText('letterLab',t.letterLab); setText('refSum',t.refSum);
  setText('libH',t.libH); setText('libSub',t.libSub);
  setText('noteT',t.noteT); setText('note',t.note); setText('pendNote',t.pendNote);
  setText('oneEngine',t.oneEngine);
  $("t1l").innerHTML=t.t1; $("t2l").innerHTML=t.t2;
  $("q").placeholder=t.ph;
  setText('selLab',t.selLab); setText('sendBtn',t.sendBtn); setText('clr',t.clear);
  setText('footCalc',t.footCalc); setText('footLib',t.foot);
  $("sentMsg").hidden=true;

  var tn=$("tnote");
  if(t.tnote){tn.textContent=t.tnote;tn.hidden=false}else{tn.hidden=true}
  Array.prototype.forEach.call(document.querySelectorAll('.lg'),function(b){
    b.setAttribute('aria-pressed',String(b.dataset.l===k));
  });
  renderList();drawSel();render();
}
$("lb").addEventListener('click',function(e){var b=e.target.closest('.lg');if(b)applyLang(b.dataset.l)});

/* initial paint */
applyLang('en');
</script>
