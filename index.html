<style>
  :root{
    --bg:#f5f3f0; --panel:#ffffff; --panel2:#fafaf8; --line:#e0d5c7;
    --ink:#1a3a52; --muted:#999; --accent:#d4a574; --accent2:#c85a3a;
    --chip:#f5f3f0; --chipink:#1a3a52;
    --pendbg:#f9f7f5; --pendink:#c85a3a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#f5f3f0;color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;padding:24px}
  body[dir="rtl"]{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',system-ui,sans-serif;line-height:1.9}
  body[data-lang="hi"]{font-family:'Nirmala UI','Noto Sans Devanagari','Segoe UI',system-ui,sans-serif}
  body[data-lang="bn"]{font-family:'Nirmala UI','Noto Sans Bengali','Shonar Bangla','Segoe UI',system-ui,sans-serif}
  .wrap{max-width:1060px;margin:0 auto}
  header h1{margin:0 0 4px;font-size:1.5rem;font-weight:700;font-family:'Lora',serif;letter-spacing:1px}
  header p{margin:0 0 20px;color:var(--muted);font-size:.9rem}
  .eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:600;display:block;margin-bottom:6px}
  body[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.85rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h2{margin:0 0 12px;font-size:1rem;color:var(--accent);font-weight:600;
    display:flex;align-items:center;gap:8px}
  label.small{display:block;color:var(--muted);font-size:.8rem;margin:10px 0 6px}
  textarea{width:100%;min-height:130px;resize:vertical;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:14px;font-size:1.9rem;direction:rtl;text-align:right;
    font-family:'Noto Nastaliq Urdu','Amiri','Noto Naskh Arabic',serif;
    line-height:2.2;unicode-bidi:plaintext}
  textarea:focus{outline:none;border-color:var(--accent)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  .toolbar .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button,select{background:var(--chip);color:var(--chipink);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#06231b;border-color:var(--accent);font-weight:600}
  button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line)}
  .switch{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:3px}
  .switch button{border:none;background:transparent;padding:6px 12px}
  .switch button.on{background:var(--accent);color:#06231b;border-radius:6px;font-weight:600}
  .keyboard{margin-top:14px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px;direction:rtl}
  .krow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:5px}
  .key{min-width:34px;text-align:center;background:var(--chip);border:1px solid var(--line);
    border-radius:6px;padding:6px 4px;font-size:1.25rem;cursor:pointer;
    font-family:'Amiri','Noto Naskh Arabic',serif}
  .key:hover{border-color:var(--accent2);background:#2c4058}
  .key.wide{min-width:70px;font-size:.8rem;font-family:'Segoe UI',sans-serif}
  .total{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .total .n{font-size:2.6rem;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums}
  .total .lab{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:start;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  .ar{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:1.5rem;direction:rtl}

<script>
"use strict";

/* ---------- Eastern (Mashriqī) Abjad values ---------- */
/* Base 28 letters: ابجد هوز حطي كلمن سعفص قرشت ثخذ ضظغ */
const ABJAD = {
  "ا":1,"ب":2,"ج":3,"د":4,"ه":5,"و":6,"ز":7,"ح":8,"ط":9,"ي":10,
  "ك":20,"ل":30,"م":40,"ن":50,"س":60,"ع":70,"ف":80,"ص":90,"ق":100,
  "ر":200,"ش":300,"ت":400,"ث":500,"خ":600,"ذ":700,"ض":800,"ظ":900,"غ":1000
};

/* Map variant / Persian / Urdu letters to their base Arabic letter */
const NORMALIZE = {
  // alif family
  "آ":"ا","أ":"ا","إ":"ا","ٱ":"ا","ٲ":"ا","ٳ":"ا","ى":"ي","ﺍ":"ا",
  // hamza carriers
  "ؤ":"و","ئ":"ي","ۀ":"ه",
  // heh / ta-marbuta family  → ه (5)
  "ة":"ه","ۃ":"ه","ہ":"ه","ھ":"ه","ﮦ":"ه","ﮧ":"ه","ۂ":"ه",
  // kaf / gaf family → ك (20)
  "ك":"ك","ک":"ك","گ":"ك","ڪ":"ك","ګ":"ك","ڱ":"ك","ﮎ":"ك",
  // yeh family → ي (10)
  "ی":"ي","ے":"ي","ۍ":"ي","ﻯ":"ي","ﯼ":"ي",
  // noon ghunna → ن (50)
  "ں":"ن","ڻ":"ن",
  // waw variants → و (6)
  "ۆ":"و","ۇ":"و","ۈ":"و","ۋ":"و","ٷ":"و",
  // Urdu / Persian retroflex & extra consonants → nearest base
  "پ":"ب","چ":"ج","ژ":"ز","ٹ":"ت","ڈ":"د","ڑ":"ر","ڤ":"ف","ڠ":"غ",
  "ٺ":"ت","ٿ":"ت","ڀ":"ب","ٻ":"ب","ڦ":"ف","ڣ":"ف",
  "ڄ":"ج","ڃ":"ج","ڇ":"ج","ڌ":"د","ڍ":"د","ڎ":"د","ڏ":"د","ڐ":"د",
  "ڒ":"ر","ړ":"ر","ڔ":"ر","ڕ":"ر","ږ":"ر","ڗ":"ر","ژ":"ز","ښ":"ش","ڛ":"س"
};

/* Arabic Presentation Forms (U+FB50–FDFF, U+FE70–FEFF) are single code points
   standing for one or more real letters. Unicode's compatibility decomposition
   (NFKC) expands them to those letters.
   Without this they score 0 — and worse than 0, because NORMALIZE already held
   a few presentation forms, so such text got PARTIAL credit: the basmala pasted
   in presentation forms scored 66 instead of 786, a plausible wrong number
   rather than an obvious zero.
   HONORIFIC FORMULAS ARE DELIBERATELY NOT EXPANDED. ﷺ and ﷻ are honorifics a
   writer adds, not letters of the text being scored; NFKC would give them 447
   and 102 and silently pre-empt a scholarly ruling. Whether they carry a value
   is an open question with the scholar — when he rules, this set is the only
   thing that changes. Keep this in lockstep with library/tools/abjad.py. */
const HONORIFICS_NO_VALUE = new Set(["ﷺ","ﷻ","﵀","﵏","﵁","﵂","﵃","﵄","﵅","﵆","﵌","﵇","﵈","﵉","﵊","﵍","﵋","﵎","﷏","﷾","﷿"]);
/* Presentation forms NFKC does not decompose but which stand for real text.
   Pasting ﷽ scored 0 while typing the same words scored 786 — two ways of
   writing the same thing must give the same number. */
const EXPLICIT_EXPANSIONS = { "﷽":"بسم الله الرحمن الرحيم" };
function isPresentationForm(cp){
  return (cp>=0xFB50 && cp<=0xFDFF) || (cp>=0xFE70 && cp<=0xFEFF);
}
function expandLigatures(s){
  let out = "";
  for(const ch of s){
    if(HONORIFICS_NO_VALUE.has(ch)){ out += ch; continue; }
    if(EXPLICIT_EXPANSIONS[ch] !== undefined){ out += EXPLICIT_EXPANSIONS[ch]; continue; }
    out += (isPresentationForm(ch.codePointAt(0)) ? ch.normalize("NFKC") : ch);
  }
  return out;
}

/* Characters that are explicitly IGNORED (diacritics, tatweel, joiners, hamza) */
function isIgnorable(ch){
  const c = ch.codePointAt(0);
  // Arabic harakat / tanwin / shadda / sukun / superscript alef etc.
  if(c>=0x0610 && c<=0x061A) return true;
  if(c>=0x064B && c<=0x065F) return true;
  if(c===0x0670) return true;                 // superscript alef
  if(c>=0x06D6 && c<=0x06ED) return true;      // Quranic annotation marks
  if(c===0x0640) return true;                  // tatweel ـ
  if(c>=0x200B && c<=0x200F) return true;      // zero-width / bidi marks
  if(c===0xFEFF) return true;                  // zero-width no-break space / BOM (invisible)
  if(c===0x0621) return true;                  // standalone hamza ء (not counted)
  if(c>=0xFE70 && c<=0xFE74) return true;      // presentation-form diacritics (was === , a real typo)
  return false;
}

function baseLetter(ch){
  if(NORMALIZE[ch]) ch = NORMALIZE[ch];
  return ch;
}

/* ---------- Core computation ---------- */
function analyze(text){
  const words = expandLigatures(text).split(/\s+/).filter(w=>w.length);
  const result = {words:[], letters:[], grand:0};
  for(const w of words){
    const wordObj = {raw:w, letters:[], sum:0};
    for(const ch of w){
      if(isIgnorable(ch)) continue;           // skip diacritics/hamza silently
      const base = baseLetter(ch);
      const val = ABJAD[base];
      if(val===undefined){
        // non-Abjad char (digit, punctuation, latin) → ignored but shown faint
        wordObj.letters.push({ch, val:null, ignored:true});
        result.letters.push({ch, val:null, ignored:true});
        continue;
      }
      wordObj.letters.push({ch, base, val, ignored:false});
      wordObj.sum += val;
      result.letters.push({ch, base, val, ignored:false});
    }
    result.words.push(wordObj);
    result.grand += wordObj.sum;
  }
  return result;
}

p for any deficiency in the prayer.","ref":"","cat":"C04","bk":"Daily adhkar","v":1807,"pend":false},{"id":"D02","ar":"اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ","tl":"Allāhumma antas-Salāmu wa minkas-salāmu, tabārakta yā dhal-Jalāli wal-Ikrām","ti":"Allahumma antas-Salam [After your Prayers]","mn":"Allah, You are the Perfect Peace and peace comes from You. Blessed are You, O Owner of majesty and honour.","pu":"Said after each prayer; the angels seek forgiveness for the one who recites these words.","ref":"","cat":"C12","bk":"Daily adhkar","v":3126,"pend":false},{"id":"D03","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ","tl":"Lā ilāha illallāhu waḥdahū lā sharīka lahū... Allāhumma lā māni‘a limā a‘tayta, wa lā mu‘tiya limā mana‘ta","ti":"La ilaha illallah – none can withhold [After your Prayers]","mn":"None has the right to be worshipped but Allah alone. O Allah, none can withhold what You give, and none can give what You have withheld.","pu":"Said after each prayer, declaring that all power and provision are in Allah’s hands alone.","ref":"","cat":"C12","bk":"Daily adhkar","v":4655,"pend":false},{"id":"D04","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ","tl":"Lā ilāha illallāhu waḥdahū lā sharīka lahū... Lā ḥawla wa lā quwwata illā billāh... mukhliṣīna lahud-dīna wa law karihal-kāfirūn","ti":"La ilaha illallah – sincere devotion [After your Prayers]","mn":"None has the right to be worshipped but Allah alone... There is no power or might except by Allah... We are sincere in our devotion to Him even though the disbelievers may dislike it.","pu":"Said after each prayer; remembrance is described as the polish of the hearts.","ref":"","cat":"C12","bk":"Daily adhkar","v":6320,"pend":false},{"id":"D05","ar":"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ","tl":"Subḥānallāh (33x), Alḥamdulillāh (33x), Allāhu Akbar (34x)","ti":"Tasbih after prayer (33/33/34) [After your Prayers]","mn":"Glorifying Allah 33 times, praising Him 33 times and magnifying Him 34 times after each prayer.","pu":"The well-known tasbih counted after every prayer. (Page layout prevented clean extraction; identified from the booklet’s structure.)","ref":"","cat":"C12","bk":"Daily adhkar","v":null,"pend":true},{"id":"D06","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ مَلِكِ ٱلنَّاسِ إِلَٰهِ ٱلنَّاسِ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","tl":"Qul a‘ūdhū birabbil-falaq... / Qul a‘ūdhū birabbin-nās...","ti":"Surah al-Falaq & al-Nas after prayer [After your Prayers]","mn":"I take refuge with the Lord of daybreak from the evil of what He created... and with the Lord of mankind from the evil of the Stealthy Whisperer.","pu":"These two surahs are recited after each prayer, and three times each after Fajr and Maghrib.","ref":"113; 114","cat":"C02","bk":"Daily adhkar","v":15148,"pend":false},{"id":"D07","ar":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ","tl":"Allāhu lā ilāha illā Huwal-Ḥayyul-Qayyūm...","ti":"Ayah al-Kursi after prayer [After your Prayers]","mn":"Allah – there is none worthy of worship save Him, the Living, the Self-Sustaining... He is the Most High, the Magnificent.","pu":"The greatest ayah of the Quran, recited after every prayer; nothing stops its reciter from Paradise except death.","ref":"2:255","cat":"C02","bk":"Daily adhkar","v":13669,"pend":false},{"id":"D08","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","tl":"Lā ilāha illallāhu waḥdahū lā sharīka lahū, lahul-mulku wa lahul-ḥamdu yuḥyī wa yumītu...","ti":"La ilaha illallah 10x after Fajr & Maghrib [After your Prayers]","mn":"None has the right to be worshipped but Allah alone... He gives life and He causes death; He has power over all things. (Ten times.)","pu":"Recited ten times in Arabic after the Fajr and Maghrib prayers.","ref":"","cat":"C12","bk":"Daily adhkar","v":2369,"pend":false},{"id":"D09","ar":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ","tl":"Allāhu lā ilāha illā Huwal-Ḥayyul-Qayyūm...","ti":"Ayah al-Kursi morning & evening [Mornings & Evenings]","mn":"Allah – there is none worthy of worship save Him, the Living, the Self-Sustaining... His Footstool encompasses the heavens and the earth.","pu":"Read every morning and evening; also read upon children as one of the best means of protection.","ref":"2:255","cat":"C02","bk":"Daily adhkar","v":13669,"pend":false},{"id":"D10","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ٱللَّهُ ٱلصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ مَلِكِ ٱلنَّاسِ إِلَٰهِ ٱلنَّاسِ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","tl":"Qul Huwallāhu Aḥad / Qul a‘ūdhū birabbil-falaq / Qul a‘ūdhū birabbin-nās","ti":"The three Quls (3x morning & evening) [Mornings & Evenings]","mn":"Surah al-Ikhlas, al-Falaq and al-Nas. “Whoever recites these three times in the morning and evening, they will suffice him against everything.”","pu":"Recited three times morning and evening; potent in repelling magic, the evil eye and every form of evil.","ref":"112; 113; 114","cat":"C02","bk":"Daily adhkar","v":16936,"pend":false},{"id":"D11","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ، وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","tl":"Aṣbaḥnā wa aṣbaḥal-mulku lillāhi wal-ḥamdu lillāhi...","ti":"Asbahna wa asbahal-mulku lillah [Mornings & Evenings]","mn":"We have started a new day and with it all dominion is Allah’s... I ask You for the good in this day... I take refuge in You from laziness, helpless old age, the Fire and the grave.","pu":"Morning and evening remembrance asking for the day’s good and refuge from its evil.","ref":"","cat":"C02","bk":"Daily adhkar","v":13392,"pend":false},{"id":"D12","ar":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ","tl":"Allāhumma bika aṣbaḥnā, wa bika amsaynā, wa bika naḥyā, wa bika namūtu wa ilaykan-nushūr","ti":"Allahumma bika asbahna (morning) [Mornings & Evenings]","mn":"O Allah, by You we enter the morning and by You we enter the evening, by You we live and by You we die, and to You is the resurrection.","pu":"Said in the mornings only.","ref":"","cat":"C12","bk":"Daily adhkar","v":1745,"pend":false},{"id":"D13","ar":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ","tl":"Allāhumma bika amsaynā, wa bika aṣbaḥnā, wa bika naḥyā, wa bika namūtu wa ilaykal-maṣīr","ti":"Allahumma bika amsayna (evening) [Mornings & Evenings]","mn":"O Allah, by You we enter the evening and by You we enter the morning, by You we live and by You we die, and to You is the Final Return.","pu":"Said in the evenings only.","ref":"","cat":"C12","bk":"Daily adhkar","v":1529,"pend":false},{"id":"D14","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","tl":"Allāhumma Anta Rabbī lā ilāha illā Anta, khalaqtanī wa anā ‘abduka...","ti":"Sayyid al-Istighfar (chief prayer for forgiveness) [Mornings & Evenings]","mn":"O Allah, You are my Lord... I acknowledge Your blessings upon me and I admit my sins. Forgive me, for there is none who forgives sins besides You.","pu":"Whoever recites this with conviction in the morning or evening and dies that day or night enters Paradise.","ref":"","cat":"C04","bk":"Daily adhkar","v":11717,"pend":false},{"id":"D15","ar":"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ","tl":"Allāhumma innī aṣbaḥtu ush-hiduka wa ush-hidu ḥamalata ‘arshika...","ti":"Calling creation to witness (4x) [Mornings & Evenings]","mn":"O Allah, I call upon You, the bearers of Your Throne, Your angels and all creation to bear witness that You are Allah... and that Muhammad is Your servant and Messenger.","pu":"Said four times in the morning or evening; Allah will spare its reciter from the fire of Hell.","ref":"","cat":"C05","bk":"Daily adhkar","v":5748,"pend":false},{"id":"D16","ar":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","tl":"Allāhumma mā aṣbaḥa bī min ni‘matin aw bi aḥadin min khalqika faminka waḥdaka...","ti":"Thanking Allah for every blessing [Mornings & Evenings]","mn":"O Allah, whatever blessing has come to me or any of Your creatures by morning is from You alone... All praise is for You and gratitude is due to You.","pu":"Whoever recites this in the morning has completed his obligation to thank Allah for that day.","ref":"","cat":"C12","bk":"Daily adhkar","v":3036,"pend":false},{"id":"D17","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ","tl":"Allāhumma ‘āfinī fī badanī, Allāhumma ‘āfinī fī sam‘ī, Allāhumma ‘āfinī fī baṣarī...","ti":"Health of body, hearing & sight (3x) [Mornings & Evenings]","mn":"O Allah, grant my body good health, preserve my hearing and my sight... I take refuge in You from disbelief and poverty, and from the punishment of the grave.","pu":"Said three times morning and evening for health and wellbeing.","ref":"","cat":"C03","bk":"Daily adhkar","v":6674,"pend":false},{"id":"D18","ar":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","tl":"Ḥasbiyallāhu lā ilāha illā Huwa ‘alayhi tawakkaltu wa Huwa Rabbul-‘Arshil-‘Aẓīm","ti":"Hasbiyallah (7x) [Mornings & Evenings]","mn":"Allah is sufficient for me. There is none worthy of worship but Him. I have placed my trust in Him, He is Lord of the Majestic Throne.","pu":"Said seven times morning and evening; Allah will grant its reciter what he desires of this world and the next.","ref":"","cat":"C08","bk":"Daily adhkar","v":3098,"pend":false},{"id":"D19","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","tl":"Allāhumma innī as’alukal-‘afwa wal-‘āfiyata fid-dunyā wal-ākhirati...","ti":"Pardon and wellbeing in everything [Mornings & Evenings]","mn":"O Allah, I ask for Your pardon and good health in this world and the next, in my religion, my worldly affairs, my family and my wealth... guard me from every direction.","pu":"A comprehensive morning and evening prayer for pardon, safety and covering of faults.","ref":"","cat":"C02","bk":"Daily adhkar","v":null,"pend":true},{"id":"D20","ar":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","tl":"Allāhumma ‘Ālimal-ghaybi wash-shahādati fāṭiras-samāwāti wal-arḍi...","ti":"Refuge from the evil of self and Satan [Mornings & Evenings]","mn":"O Allah, Knower of the unseen and the seen... I take refuge in You from the evil of my soul and from the evil of Satan and his shirk, and from harming myself or any Muslim.","pu":"Morning and evening protection from one’s own evil and the whispers of Satan.","ref":"","cat":"C02","bk":"Daily adhkar","v":9852,"pend":false},{"id":"D21","ar":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","tl":"Bismillāhil-ladhī lā yaḍurru ma‘as-mihī shay’un fil-arḍi wa lā fis-samā’i...","ti":"Bismillah – nothing can harm (3x) [Mornings & Evenings]","mn":"In the Name of Allah with whose Name nothing can cause harm, neither in the earth nor in the heavens. He is the All-Hearing, the All-Knowing.","pu":"Whoever recites it three times morning or evening will not be afflicted by any calamity.","ref":"","cat":"C02","bk":"Daily adhkar","v":4266,"pend":false},{"id":"D22","ar":"رَضِيتُ بِاللَّهِ رَبّاً، وَبِالْإِسْلَامِ دِيناً، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيّاً","tl":"Raḍītu billāhi Rabban, wa bil-Islāmi dīnan, wa bi Muḥammadin Nabiyyan","ti":"Pleased with Allah, Islam and the Prophet (3x) [Mornings & Evenings]","mn":"I am pleased with Allah as my Lord, with Islam as my religion and with Muhammad (pbuh) as my Prophet.","pu":"Said three times morning and evening; Allah has promised its reciter will be pleased on the Day of Rising.","ref":"","cat":"C06","bk":"Daily adhkar","v":2527,"pend":false},{"id":"D23","ar":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","tl":"Yā Ḥayyu yā Qayyūmu biraḥmatika astaghīthu aṣliḥ lī sha’nī kullahu...","ti":"Ya Hayyu ya Qayyum – set my affairs right [Mornings & Evenings]","mn":"O Ever Living One, O Self-Sustaining One, by Your mercy I ask for Your support in setting all my affairs right. Do not leave me to my soul for the blink of an eye.","pu":"A cry for help in distress, asking Allah to correct all one’s affairs.","ref":"","cat":"C08","bk":"Daily adhkar","v":4634,"pend":false},{"id":"D24","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ","tl":"Aṣbaḥnā wa aṣbaḥal-mulku lillāhi Rabbil-‘ālamīn... khayra hādhal-yawmi: fatḥahu wa naṣrahu wa nūrahu... / Amsaynā...","ti":"Good of this day / this night (16a & 16b) [Mornings & Evenings]","mn":"O Allah, I ask You for the good in this day (or night): its victory, its help, its light, its blessings and its guidance; I take refuge in You from its evil.","pu":"Version (a) said in the morning, version (b) in the evening.","ref":"","cat":"C02","bk":"Daily adhkar","v":null,"pend":true},{"id":"D25","ar":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ الْمُشْرِكِينَ","tl":"Aṣbaḥnā ‘alā fiṭratil-Islāmi wa ‘alā kalimatil-ikhlāṣi...","ti":"Upon the natural religion of Islam [Mornings & Evenings]","mn":"We have started a new day upon the natural religion of Islam, the statement of sincerity, the religion of our Prophet Muhammad and the faith of our father Ibrahim.","pu":"Morning and evening declaration of remaining firm upon Islam.","ref":"","cat":"C06","bk":"Daily adhkar","v":4208,"pend":false},{"id":"D26","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","tl":"Subḥānallāhi wa biḥamdihī","ti":"SubhanAllahi wa bihamdihi (100x) [Mornings & Evenings]","mn":"Allah is Transcendent and all praise is due to Him. (One hundred times.)","pu":"Whoever recites it 100 times morning and evening will not be surpassed on the Day of Rising except by one who recited more.","ref":"","cat":"C12","bk":"Daily adhkar","v":252,"pend":false},{"id":"D27","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","tl":"Lā ilāha illallāhu waḥdahū lā sharīka lahū, lahul-mulku wa lahul-ḥamdu...","ti":"La ilaha illallah (10x) [Mornings & Evenings]","mn":"None has the right to be worshipped but Allah alone who has no partner... He has power over all things. (Ten times, or once to ward off laziness.)","pu":"Brings the reward of freeing a slave, one hundred good deeds, one hundred sins forgiven, and protection from Satan until dusk.","ref":"","cat":"C12","bk":"Daily adhkar","v":1865,"pend":false},{"id":"D28","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ","tl":"Subḥānallāhi wa biḥamdihī: ‘adada khalqihī, wa riḍā nafsihī, wa zinata ‘arshihī wa midāda kalimātihī","ti":"SubhanAllah – as much as His creation (3x) [Mornings & Evenings]","mn":"Allah is Transcendent and all praise belongs to Him: as much as the number of His creation, His good-pleasure, the weight of His Throne and the extent of His words.","pu":"Recited three times upon rising in the morning.","ref":"","cat":"C12","bk":"Daily adhkar","v":3461,"pend":false},{"id":"D29","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً","tl":"Allāhumma innī as’aluka ‘ilman nāfi‘an, wa rizqan ṭayyiban, wa ‘amalan mutaqabbalan","ti":"Beneficial knowledge, provision & accepted deeds [Mornings & Evenings]","mn":"O Allah, I ask You for beneficial knowledge, wholesome provision and deeds that will be accepted.","pu":"Said in Arabic upon rising in the morning.","ref":"","cat":"C10","bk":"Daily adhkar","v":1678,"pend":false},{"id":"D30","ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","tl":"Astaghfirullāha wa atūbu ilayhi","ti":"Istighfar through the day (100x) [Mornings & Evenings]","mn":"I ask Allah’s forgiveness and turn to Him in repentance. (One hundred times during the day.)","pu":"Constant repentance through the day, following the Prophet’s practice.","ref":"","cat":"C04","bk":"Daily adhkar","v":2268,"pend":false},{"id":"D31","ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","tl":"A‘ūdhu bikalimātillāhit-tāmmāti min sharri mā khalaqa","ti":"Refuge in Allah’s perfect words (3x, evening) [Mornings & Evenings]","mn":"I take refuge in Allah’s Perfect Words from the evil of what He has created.","pu":"Said three times in the evening; the reciter is protected from insect stings and harm.","ref":"","cat":"C02","bk":"Daily adhkar","v":3570,"pend":false},{"id":"Q01","ar":"﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ مَٰلِكِ يَوْمِ ٱلدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ","tl":"Sūrah al-Fātiḥah","ti":"Surah al-Fatihah (7x) – ruqyah","mn":"The opening chapter of the Quran, recited seven times as ruqyah (Arabic text not printed in a readable form in this booklet).","pu":"One of the strongest ruqyah recitations; a cure for illness, evil eye and magic.","ref":"1:1-7","cat":"C03","bk":"Ruqyah","v":10143,"pend":false},{"id":"Q02","ar":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ","tl":"Āyah al-Kursī","ti":"Ayah al-Kursi – ruqyah","mn":"The Verse of the Throne, describing Allah’s living, self-sustaining power over the heavens and the earth.","pu":"The strongest protection against the evil of jinn; it repels Satan.","ref":"2:255","cat":"C01","bk":"Ruqyah","v":13669,"pend":false},{"id":"Q03","ar":"لِّلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَإِن تُبْدُوا۟ مَا فِىٓ أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ ٱللَّهُ ۖ فَيَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍۢ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Āmannar-Rasūlu...","ti":"Last verses of Surah al-Baqarah","mn":"The closing verses of Surah al-Baqarah, recited in ruqyah and before sleeping.","pu":"“Whoever recites them at night, they will suffice him.” Protection through the night.","ref":"2:284-286","cat":"C02","bk":"Ruqyah","v":26815,"pend":false},{"id":"Q04","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ٱللَّهُ ٱلصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ","tl":"Qul Huwallāhu Aḥad","ti":"Surah al-Ikhlas – ruqyah","mn":"The chapter of pure monotheism: He is Allah, the One and Only, the Everlasting Sustainer of all.","pu":"Recited with the last two surahs as ruqyah and protection; the Prophet blew them over his body in illness.","ref":"112","cat":"C02","bk":"Ruqyah","v":1788,"pend":false},{"id":"Q05","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","tl":"Qul a‘ūdhū birabbil-falaq","ti":"Surah al-Falaq – ruqyah","mn":"Seeking refuge with the Lord of daybreak from the evil of creation, darkness, blowers on knots and the envier.","pu":"Revealed as a cure for magic; among the strongest protection against envy, evil eye, magic and jinn.","ref":"113","cat":"C01","bk":"Ruqyah","v":9461,"pend":false},{"id":"Q06","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ مَلِكِ ٱلنَّاسِ إِلَٰهِ ٱلنَّاسِ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","tl":"Qul a‘ūdhū birabbin-nās","ti":"Surah al-Nas – ruqyah","mn":"Seeking refuge with the Lord of mankind from the whisperer who whispers in people’s breasts, from jinn and man.","pu":"Revealed as a cure for magic; among the strongest protection against envy, evil eye, magic and jinn.","ref":"114","cat":"C01","bk":"Ruqyah","v":5687,"pend":false},{"id":"Q07","ar":"۞ وَأَوْحَيْنَآ إِلَىٰ مُوسَىٰٓ أَنْ أَلْقِ عَصَاكَ ۖ فَإِذَا هِىَ تَلْقَفُ مَا يَأْفِكُونَ فَوَقَعَ ٱلْحَقُّ وَبَطَلَ مَا كَانُوا۟ يَعْمَلُونَ فَغُلِبُوا۟ هُنَالِكَ وَٱنقَلَبُوا۟ صَٰغِرِينَ","tl":"","ti":"Verses against magic – Surah al-A‘raf","mn":"The verses of Musa’s staff swallowing the magicians’ falsehood: “So the truth was established and what they were doing was made vain.”","pu":"Added to the ruqyah if one is affected by magic; narrated as a cure by the will of Allah.","ref":"7:117-119","cat":"C01","bk":"Ruqyah","v":5755,"pend":false},{"id":"Q08","ar":"فَلَمَّآ أَلْقَوْا۟ قَالَ مُوسَىٰ مَا جِئْتُم بِهِ ٱلسِّحْرُ ۖ إِنَّ ٱللَّهَ سَيُبْطِلُهُۥٓ ۖ إِنَّ ٱللَّهَ لَا يُصْلِحُ عَمَلَ ٱلْمُفْسِدِينَ وَيُحِقُّ ٱللَّهُ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَلَوْ كَرِهَ ٱلْمُجْرِمُونَ","tl":"","ti":"Verses against magic – Surah Yunus","mn":"Musa declares that Allah will make the magicians’ work vain: “Allah does not amend the work of corrupters.”","pu":"Added to the ruqyah if one is affected by magic.","ref":"10:81-82","cat":"C01","bk":"Ruqyah","v":3733,"pend":false},{"id":"Q09","ar":"وَأَلْقِ مَا فِى يَمِينِكَ تَلْقَفْ مَا صَنَعُوٓا۟ ۖ إِنَّمَا صَنَعُوا۟ كَيْدُ سَٰحِرٍۢ ۖ وَلَا يُفْلِحُ ٱلسَّاحِرُ حَيْثُ أَتَىٰ","tl":"","ti":"Verse against magic – Surah Ta-Ha","mn":"“Throw what is in your right hand; it will swallow up what they have crafted. What they have crafted is only a magician’s trick, and the magician will not succeed wherever he goes.”","pu":"Added to the ruqyah if one is affected by magic.","ref":"20:69","cat":"C01","bk":"Ruqyah","v":3271,"pend":false},{"id":"Q10","ar":"","tl":"Prophetic ruqyah duas (Muslim, Ahmad, Bukhari, Muwatta’, Hakim, Abu Dawud, Tirmidhi)","ti":"Ruqyah supplications from the Sunnah","mn":"A set of the Prophet’s own healing supplications, including the dua said with the hand on the place of pain (7x). The Arabic is not machine-readable in this booklet.","pu":"Recited over oneself or others for illness and pain; some are said seven times.","ref":"","cat":"C03","bk":"Ruqyah","v":null,"pend":true},{"id":"Q11","ar":"أُعِيْذُكُمَا بِكَلِمَاتِ اللهِ التَّامَّةِ ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ.","tl":"The words the Prophet used for Hasan and Husayn (Bukhari)","ti":"Protection dua for children","mn":"The Prophet’s dua seeking Allah’s protection for his grandchildren. Arabic not machine-readable in this booklet.","pu":"Parents recite it over children, who are more vulnerable to the evil eye; recited with Ayah al-Kursi and the last 3 surahs.","ref":"","cat":"C01","bk":"Ruqyah","v":null,"pend":true},{"id":"Q12","ar":"اَللّٰهُمَّ أَذْهِبْ عَنْهُ حَرَّهَا وَبَرْدَهَا وَوَصَبَهَا.","tl":"The Prophet’s supplication for his afflicted companion (Ahmad)","ti":"Dua for one struck by the evil eye","mn":"The words the Prophet supplicated for a companion afflicted with the evil eye. Arabic not machine-readable in this booklet.","pu":"Recited over a person showing the effects of the evil eye.","ref":"","cat":"C01","bk":"Ruqyah","v":null,"pend":true},{"id":"Q13","ar":"","tl":"","ti":"Additional verses of Allah’s greatness","mn":"Verses mentioning the greatness and oneness of Allah, with Surah al-Mulk and al-Rahman, added to strengthen the ruqyah.","pu":"Repeated (at least 7x) when certain verses produce stronger reactions during ruqyah.","ref":"2:164; 3:18; 7:54; 23:118; 37:1-10; 59:24; 72:3","cat":"C01","bk":"Ruqyah","v":null,"pend":true},{"id":"R01","ar":"وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ","tl":"Rabbana taqabbal minnaa innaka Antas Samee’ul Aleem","ti":"Rabbana dua #1","mn":"Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing.","pu":"You can recite this du’a whenever you would like for Allah (swt) to accept whatever good you’ve just done. Du’a Prophet Ibrahim (as) recited after building the kaaba with his son.","ref":"2:127","cat":"C11","bk":"40 Rabbana duas","v":4067,"pend":false},{"id":"R02","ar":"رَبَّنَا وَٱجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةًۭ مُّسْلِمَةًۭ لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَآ ۖ إِنَّكَ أَنتَ ٱلتَّوَّابُ ٱلرَّحِيمُ","tl":"Rabbana waj’alnaa muslimaini laka wa min zurriyyatinaaa ummatam muslimatal laka wa arinaa manaasikanaa wa tub ‘alainaa innaka antat Tawwaabur Raheem","ti":"Rabbana dua #2","mn":"Our Lord, and make us Muslims [in submission] to You and from our descendants a Muslim nation [in submission] to You. And show us our rites [of worship] and accept our repentance. Indeed, You are…","pu":"This du’a should be recited to affirm your faith in Islam. It also a good prayer that asks for the success of the entire Muslim Ummah. Du’a Prophet Ibrahim (as) recited after building the kaaba with…","ref":"2:128","cat":"C06","bk":"40 Rabbana duas","v":4722,"pend":false},{"id":"R03","ar":"وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ وَفِى ٱلْءَاخِرَةِ حَسَنَةًۭ وَقِنَا عَذَابَ ٱلنَّارِ","tl":"Rabbana atina fid dunyaa hasanatanw wa fil aakhirati hasanatanw wa qinaa azaaban Naar","ti":"Rabbana dua #3","mn":"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.","pu":"One of the best duas any believer can recite. It asks for good in this world while not forgetting to ask about good in the akhira (afterlife). “So remember Me; I will remember you. And be grateful…","ref":"2:201","cat":"C10","bk":"40 Rabbana duas","v":3659,"pend":false},{"id":"R04","ar":"وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Rabbana afrigh ‘alainaa sabranw wa sabbit aqdaamanaa wansurnaa ‘alal qawmil kaafireen","ti":"Rabbana dua #4","mn":"Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving people.","pu":"Asking Allah (swt) for protection, patience in whatever endeavor, and to be victorious. Prophetic du’a for protection recited by Prophet dawud (as): Dawud (as) was a smaller, younger man and on…","ref":"2:250","cat":"C07","bk":"40 Rabbana duas","v":5144,"pend":false},{"id":"R05","ar":"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Rabbana laa tu’aakhiznaaa in naseenaaa aw akhtaanaa","ti":"Rabbana dua #5","mn":"Our Lord, do not impose blame upon us if we have forgotten or erred.","pu":"This is a du’a for tawbah (repentance). Asking for the forgiveness of Allah (swt) is the best kind of du’a a believer can make. It shows humility in your character, protects you from boasting or…","ref":"2:286","cat":"C04","bk":"40 Rabbana duas","v":12863,"pend":false},{"id":"R06","ar":"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Rabbana wa laa tahmil-‘alainaaa isran kamaa hamaltahoo ‘alal-lazeena min qablinaa","ti":"Rabbana dua #6","mn":"Our Lord, and lay not upon us a burden like that which You laid upon those before us.","pu":"This is a du’a asking Allah (swt) to make the path of righteousness easy upon the believers. Asking Allah (swt) for our life’s tests to be ones that we are capable of enduring and overcoming. To not…","ref":"2:286","cat":"C07","bk":"40 Rabbana duas","v":12863,"pend":false},{"id":"R07","ar":"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Rabbana wa laa tuhammilnaa maa laa taaqata lanaa bih; wa’fu ‘annaa waghfir lanaa warhamnaa; Anta mawlaanaa fansurnaa ‘alal qawmil kaafireen","ti":"Rabbana dua #7","mn":"Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.","pu":"The last ayat of Surah Baqarah alone contains 3 powerful duas which can be recited together or independently. These last 2 ayat are among the most memorized verses of the Qur’an. The Messenger of…","ref":"2:286","cat":"C04","bk":"40 Rabbana duas","v":12863,"pend":false},{"id":"R08","ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ","tl":"Rabbana laa tuzigh quloobanaa ba’da iz hadaitanaa wa hab lanaa mil ladunka rahmah; innaka antal Wahhaab","ti":"Rabbana dua #8","mn":"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower.","pu":"Another beautiful du’a a believer can recite asking for Allah’s rahma (mercy). The believer understands that all things are made possible through Allah (swt). In this du’a, we ask of Allah to make…","ref":"3:8","cat":"C06","bk":"40 Rabbana duas","v":4235,"pend":false},{"id":"R09","ar":"رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوْمٍۢ لَّا رَيْبَ فِيهِ ۚ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ","tl":"Rabbana innaka jami’unnasi li-Yawmil la raiba fi innallaha la yukhliful mi’aad","ti":"Rabbana dua #9","mn":"Our Lord, surely You will gather the people for a Day about which there is no doubt. Indeed, Allah does not fail in His promise.","pu":"This is a du’a of the believers to affirm their faith in the afterlife. A place where we will either reap the rewards for our good deeds and our actions or pay the price of errors. “Indeed, Allah…","ref":"3:9","cat":"C05","bk":"40 Rabbana duas","v":2028,"pend":false},{"id":"R10","ar":"ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ","tl":"Rabbanaaa innanaaa aamannaa faghfir lanaa zunoobanaa wa qinaa ‘azaaban Naar","ti":"Rabbana dua #10","mn":"Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire","pu":"A du’a for repentance and protection. We ask Allah (swt) for forgiveness and to shield us from the punishment of the hellfire. “[Remember] when you were asking help of your Lord, and He answered…","ref":"3:16","cat":"C04","bk":"40 Rabbana duas","v":4903,"pend":false},{"id":"R11","ar":"رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ","tl":"Rabbanaaa aamannaa bimaaa anzalta wattaba’nar Rasoola faktubnaa ma’ash shaahideen","ti":"Rabbana dua #11","mn":"Our Lord, we have believed in what You revealed and have followed the messenger [i.e., Jesus], so register us among the witnesses [to truth].","pu":"Du’a of faith & worship, i.e. to register us among the witnesses to the truth. In the Qur’an we’re told of how Allah (swt) saved Isa (as) from the children of Israel who plotted against him:…","ref":"3:53","cat":"C06","bk":"40 Rabbana duas","v":2797,"pend":false},{"id":"R12","ar":"وَمَا كَانَ قَوْلَهُمْ إِلَّآ أَن قَالُوا۟ رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"Rabbanagh fir lanaa zunoobanaa wa israafanaa feee amirnaa wa sabbit aqdaamanaa wansurnaa ‘alal qawmil kaafireen","ti":"Rabbana dua #12","mn":"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people.","pu":"Du’a for repentance, victory, and resiliency. To plant one’s feet firmly in the face of evil. In the following verse it says, “So Allah gave them the reward of this world and the good reward of the…","ref":"3:147","cat":"C04","bk":"40 Rabbana duas","v":5906,"pend":false},{"id":"R13","ar":"ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَٰمًۭا وَقُعُودًۭا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَٰطِلًۭا سُبْحَٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ","tl":"Rabbanaa maa khalaqta haaza baatilan Subhaanaka faqinaa ‘azaaban Naar","ti":"Rabbana dua #13","mn":"Our Lord, You did not create this aimlessly; exalted are You [above such a thing]; then protect us from the punishment of the Fire.","pu":"Du’a praising Allah (swt) and asking for His protection from Jahannam (fire). If we take the time to look at the world, we see how complex yet organized all of Allah’s creations are. We can see…","ref":"3:191","cat":"C05","bk":"40 Rabbana duas","v":9168,"pend":false},{"id":"R14","ar":"رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ ۖ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍۢ","tl":"Rabbanaaa innaka man tudkhilin Naara faqad akhzai tahoo wa maa lizzaalimeena min ansaar","ti":"Rabbana dua #14","mn":"Our Lord, indeed whoever You admit to the Fire – You have disgraced him, and for the wrongdoers there are no helpers.","pu":"We may not think a whole lot about where we originally came from but, at some point, we’ll begin to think about where we are headed. We’ll start to ponder the consequences of our actions. It’s an…","ref":"3:192","cat":"C05","bk":"40 Rabbana duas","v":4506,"pend":false},{"id":"R15","ar":"رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًۭا يُنَادِى لِلْإِيمَٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ","tl":"Rabbanaaa innanaa sami'naa munaadiyai yunaadee lil eemaani an aaminoo bi Rabbikum fa aamannaa","ti":"Rabbana dua #15","mn":"Our Lord, indeed we have heard a caller, calling to faith, [saying], ‘Believe in your Lord,’ and we have believed.","pu":"Du’a of humility, submission and faith. We have heard a caller (referring to Prophet Muhammad saws) and we have listened to his message and we believe.","ref":"3:193","cat":"C06","bk":"40 Rabbana duas","v":6044,"pend":false},{"id":"R16","ar":"رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًۭا يُنَادِى لِلْإِيمَٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ","tl":"Rabbanaa faghfir lanaa zunoobanaa wa kaffir ‘annaa saiyi aatina wa tawaffanaa ma’al abraar","ti":"Rabbana dua #16","mn":"Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die among the righteous.","pu":"A du’a for repentance, washing away our misdeeds, and asking Alla (swt) to cause us to die guided on the right path. (One night) I stayed overnight in the house of my aunt Maimuna, and said to…","ref":"3:193","cat":"C04","bk":"40 Rabbana duas","v":6044,"pend":false},{"id":"R17","ar":"رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَٰمَةِ ۗ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ","tl":"Rabbanaa wa aatinaa maa wa’attanaa ‘alaa Rusulika wa laa tukhzinaa Yawmal Qiyaamah; innaka laa tukhliful mee’aad","ti":"Rabbana dua #17","mn":"Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise.","pu":"Du’a of humility, to be saved from being disgraced on the day of judgment. To a true believer, there is no doubt that Allah (swt) will indeed fulfill his promise. Rather this is a prayer to Allah…","ref":"3:194","cat":"C05","bk":"40 Rabbana duas","v":4408,"pend":false},{"id":"R18","ar":"وَإِذَا سَمِعُوا۟ مَآ أُنزِلَ إِلَى ٱلرَّسُولِ تَرَىٰٓ أَعْيُنَهُمْ تَفِيضُ مِنَ ٱلدَّمْعِ مِمَّا عَرَفُوا۟ مِنَ ٱلْحَقِّ ۖ يَقُولُونَ رَبَّنَآ ءَامَنَّا فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ","tl":"Rabbanaaa aamannaa faktubnaa ma’ash shaahideen","ti":"Rabbana dua #18","mn":"Our Lord, we have believed, so register us among the witnesses.","pu":"A du’a for those who want to testify the truth and verbally affirm their belief in it. Any who is (so) grateful does so to the profit of his own soul: but if any is ungrateful, verily Allah is free…","ref":"5:83","cat":"C06","bk":"40 Rabbana duas","v":5971,"pend":false},{"id":"R19","ar":"قَالَ عِيسَى ٱبْنُ مَرْيَمَ ٱللَّهُمَّ رَبَّنَآ أَنزِلْ عَلَيْنَا مَآئِدَةًۭ مِّنَ ٱلسَّمَآءِ تَكُونُ لَنَا عِيدًۭا لِّأَوَّلِنَا وَءَاخِرِنَا وَءَايَةًۭ مِّنكَ ۖ وَٱرْزُقْنَا وَأَنتَ خَيْرُ ٱلرَّٰزِقِينَ","tl":"Rabbanaaa anzil ‘alainaa maaa’idatam minas samaaa’i takoonu lanaa ‘eedal li awwalinaa wa aakhirinaa wa Aayatam minka warzuqnaa wa Anta khairur raaziqeen","ti":"Rabbana dua #19","mn":"O Allah, our Lord, send down to us a table [spread with food] from the heaven to be for us a festival for the first of us and the last of us and a sign from You. And provide for us, and You are the…","pu":"A du’a for provision. Provision is all encompassing term meaning to supply with food, money, or way to make a living. All good provisions come from Allah (swt), we turn to him and ask him to provide…","ref":"5:114","cat":"C10","bk":"40 Rabbana duas","v":5294,"pend":false},{"id":"R20","ar":"قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَٰسِرِينَ","tl":"Rabbanaa zalamnaaa anfusanaa wa illam taghfir lanaa wa tarhamnaa lanakoonanna minal khaasireen","ti":"Rabbana dua #20","mn":"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.","pu":"A du’a for repentance (tawbah). We can learn from how Adam (as) responded after he erred. Being able to admit your faults and to harbor guilt is a beautiful sign of your belief and dedication to…","ref":"7:23","cat":"C04","bk":"40 Rabbana duas","v":5488,"pend":false},{"id":"R21","ar":"۞ وَإِذَا صُرِفَتْ أَبْصَٰرُهُمْ تِلْقَآءَ أَصْحَٰبِ ٱلنَّارِ قَالُوا۟ رَبَّنَا لَا تَجْعَلْنَا مَعَ ٱلْقَوْمِ ٱلظَّٰلِمِينَ","tl":"Rabbanaa laa taj’alnaa ma’al qawmiz zaalimeen","ti":"Rabbana dua #21","mn":"Our Lord, do not place us with the wrongdoing people.","pu":"We should know that we are the sum total of the people we associate with. Intellectually we may know that the fate of the wrongdoing people will not be pleasant one but, in our dayto- day life, we…","ref":"7:47","cat":"C13","bk":"40 Rabbana duas","v":5054,"pend":false},{"id":"R22","ar":"قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ","tl":"Rabbanaf-tah bainana wa baina qawmina bil haqqi wa anta Khairul Fatiheen","ti":"Rabbana dua #22","mn":"Our Lord, decide between us and our people in truth, and You are the best of those who give decision.","pu":"Du’a of Prophet Suhaib (as). Prophet Suhaib (as) recited this du’a after facing heavy opposition from the eminent people of the city. They threatened to evict him from the city unless he fabricated…","ref":"7:89","cat":"C13","bk":"40 Rabbana duas","v":9478,"pend":false},{"id":"R23","ar":"وَمَا تَنقِمُ مِنَّآ إِلَّآ أَنْ ءَامَنَّا بِـَٔايَٰتِ رَبِّنَا لَمَّا جَآءَتْنَا ۚ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَتَوَفَّنَا مُسْلِمِينَ","tl":"Rabbanaaa afrigh ‘alainaa sabranw wa tawaffanaa muslimeen","ti":"Rabbana dua #23","mn":"Our Lord, pour upon us patience and let us die as Muslims [in submission to You].","pu":"Du’a of Prophet Musa (as). Du’a for sabr (patience), perseverance, and a prayer requesting Allah to let us die righteously. This was recited after Firawn resorted to persecution and threatened Musa…","ref":"7:126","cat":"C07","bk":"40 Rabbana duas","v":4856,"pend":false},{"id":"R24","ar":"فَقَالُوا۟ عَلَى ٱللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلْقَوْمِ ٱلظَّٰلِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ ٱلْقَوْمِ ٱلْكَٰفِرِينَ","tl":"85. Rabbana la taj’alna fitnatal lil-qawmidh-Dhalimeen ; 86. wa najjina bi- Rahmatika minal qawmil kafireen","ti":"Rabbana dua #24","mn":"Our Lord, make us not [objects of] trial for the wrongdoing people. And save us by Your mercy from the disbelieving people.","pu":"This is a prayer the companions of Musa (as) recited asking for protection from evil and unjust people. It is a du’a for success and protection. It asks to not be made examples of by disbelieving…","ref":"10:85-86","cat":"C13","bk":"40 Rabbana duas","v":4979,"pend":false},{"id":"R25","ar":"رَبَّنَآ إِنَّكَ تَعْلَمُ مَا نُخْفِى وَمَا نُعْلِنُ ۗ وَمَا يَخْفَىٰ عَلَى ٱللَّهِ مِن شَىْءٍۢ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ","tl":"Rabbanaaa innaka ta’lamu maa nukhfee wa maa nu’lin; wa maa yakhfaa ‘alal laahi min shai’in fil ardi wa laa fis samaaa’","ti":"Rabbana dua #25","mn":"Our Lord, indeed You know what we conceal and what we declare, and nothing is hidden from Allah on the earth or in the heaven.","pu":"Du’a showing complete trust and reliance on Allah (swt). This du’a is a reminder that Allah is all knowing and all powerful. That nothing can be hidden from Allah (swt). He knows the intent behind…","ref":"14:38","cat":"C12","bk":"40 Rabbana duas","v":4596,"pend":false},{"id":"R26","ar":"رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ","tl":"Rabbij ‘alnee muqeemas Salaati wa min zurriyyatee Rabbanaa wa taqabbal du’aaa","ti":"Rabbana dua #26","mn":"My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.","pu":"Du’a of Prophet Ibrahim (as). Prophet Ibrahim (as) knows of the past communities and how they have erred. So, in this du’a, he asks Allah (swt) to make ourselves and the future generations good…","ref":"14:40","cat":"C09","bk":"40 Rabbana duas","v":3000,"pend":false},{"id":"R27","ar":"رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ","tl":"Rabbanagh fir lee wa liwaalidaiya wa lilmu’mineena Yawma yaqoomul hisaab","ti":"Rabbana dua #27","mn":"Our Lord, forgive me and my parents and the believers the Day the account is established.","pu":"Du’a of Prophet Ibrahim (as) Recommended use: Du’a asking Allah (swt) to forgive you and your parents. Abu Hurairah (ra) said, “The dead person can be raised a degree after his death. He said, ‘My…","ref":"14:41","cat":"C04","bk":"40 Rabbana duas","v":2236,"pend":false},{"id":"R28","ar":"إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا","tl":"Rabbanaaa aatinaa mil ladunka rahmatanw wa haiyi’ lanaa min amrinaa rashadaa","ti":"Rabbana dua #28","mn":"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.","pu":"Du’a seeking Allah’s (swt) approval, mercy, provision, and patience. This du’a is found in Surah Kahf (titled ‘the cave’) and was recited by the young men who fled their city fearing persecution for…","ref":"18:10","cat":"C06","bk":"40 Rabbana duas","v":3790,"pend":false},{"id":"R29","ar":"قَالَا رَبَّنَآ إِنَّنَا نَخَافُ أَن يَفْرُطَ عَلَيْنَآ أَوْ أَن يَطْغَىٰ","tl":"Rabbanaaa innanaa nakhaafu ai yafruta ‘alainaaa aw ai yatghaa","ti":"Rabbana dua #29","mn":"Our Lord, indeed we are afraid that he will hasten [punishment] against us or that he will transgress.","pu":"Du’a both Harun (as) and Musa (as) recited. It can be scary to stand up for what is right, to avoid being a bystander when we see injustice happening around us. This wasn’t easy for Harun (as) and…","ref":"20:45","cat":"C08","bk":"40 Rabbana duas","v":2816,"pend":false},{"id":"R30","ar":"إِنَّهُۥ كَانَ فَرِيقٌۭ مِّنْ عِبَادِى يَقُولُونَ رَبَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا وَٱرْحَمْنَا وَأَنتَ خَيْرُ ٱلرَّٰحِمِينَ","tl":"Rabbanaaa aamannaa faghfir lanaa warhamnaa wa Anta khairur raahimeen","ti":"Rabbana dua #30","mn":"Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.","pu":"Du’a asking for Allah’s mercy and calling upon by his rightful attribute of being Ar-Rahim meaning the most merciful. Other verses in the Qur’an claiming he is the most merciful are 7:151, 21:83,…","ref":"23:109","cat":"C04","bk":"40 Rabbana duas","v":4595,"pend":false},{"id":"R31","ar":"وَٱلَّذِينَ يَقُولُونَ رَبَّنَا ٱصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا إِنَّهَا سَآءَتْ مُسْتَقَرًّۭا وَمُقَامًۭا","tl":"65. Rabbanas rif ‘annnaa ‘azaaba Jahannama inn ‘azaabahaa kaana gharaamaa 66. Innahaa saaa’at mustaqarranw wa muqaamaa","ti":"Rabbana dua #31","mn":"Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering; Indeed, it is evil as a settlement and residence.","pu":"Du’a reminding us of the evil residence that is hell. It asks Allah (swt) for our protection from Jahannam.","ref":"25:65-66","cat":"C05","bk":"40 Rabbana duas","v":6265,"pend":false},{"id":"R32","ar":"وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍۢ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","tl":"Rabbanaa hab lanaa min azwaajinaa wa zurriyaatinaa qurrata a’yuninw waj ‘alnaa lilmuttaqeena Imaamaa","ti":"Rabbana dua #32","mn":"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous.","pu":"qurrata ‘ayioni is an old Arabic expression meaning to bring ‘coolness to the eye’ particularly from spiritual perspective to bring calmness, joy, or happiness. Asking Allah (swt) to grant us…","ref":"25:74","cat":"C09","bk":"40 Rabbana duas","v":4205,"pend":false},{"id":"R33","ar":"وَقَالُوا۟ ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَذْهَبَ عَنَّا ٱلْحَزَنَ ۖ إِنَّ رَبَّنَا لَغَفُورٌۭ شَكُورٌ","tl":"Rabbana la Ghafurun shakur","ti":"Rabbana dua #33","mn":"Our Lord is Forgiving and Appreciative","pu":"The Qur’an mentions how this will be the type of du’a a believer would recite when they enter the Garden of Eden. They will praise Allah (swt) and thank him endlessly for being forgiving and…","ref":"35:34","cat":"C12","bk":"40 Rabbana duas","v":4104,"pend":false},{"id":"R34","ar":"ٱلَّذِينَ يَحْمِلُونَ ٱلْعَرْشَ وَمَنْ حَوْلَهُۥ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَيُؤْمِنُونَ بِهِۦ وَيَسْتَغْفِرُونَ لِلَّذِينَ ءَامَنُوا۟ رَبَّنَا وَسِعْتَ كُلَّ شَىْءٍۢ رَّحْمَةًۭ وَعِلْمًۭا فَٱغْفِرْ لِلَّذِينَ تَابُوا۟ وَٱتَّبَعُوا۟ سَبِيلَكَ وَقِهِمْ عَذَابَ ٱلْجَحِيمِ","tl":"Rabbanaa wasi’ta kulla shai’ir rahmatanw wa ‘ilman faghfir lillazeena taaboo wattaba’oo sabeelaka wa qihim ‘azaabal Jaheem","ti":"Rabbana dua #34","mn":"Our Lord, You have encompassed all things in mercy and knowledge, so forgive those who have repented and followed Your way and protect them from the punishment of Hellfire.","pu":"Allah’s (swt) knowledge and his mercy know no limit, it is infinite. This du’a asks Allah (swt) to be merciful towards all those who believe and have sought istighfar (repentance) from their creator.","ref":"40:7","cat":"C04","bk":"40 Rabbana duas","v":10787,"pend":false},{"id":"R35","ar":"رَبَّنَا وَأَدْخِلْهُمْ جَنَّٰتِ عَدْنٍ ٱلَّتِى وَعَدتَّهُمْ وَمَن صَلَحَ مِنْ ءَابَآئِهِمْ وَأَزْوَٰجِهِمْ وَذُرِّيَّٰتِهِمْ ۚ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ وَقِهِمُ ٱلسَّيِّـَٔاتِ ۚ وَمَن تَقِ ٱلسَّيِّـَٔاتِ يَوْمَئِذٍۢ فَقَدْ رَحِمْتَهُۥ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ","tl":"8.Rabbana wa adhkhilhum Jannati ‘adninil-lati wa’attahum wa man salaha min aba’ihim wa azwajihim wa dhuriyyatihim innaka antal ‘Azizul-Hakim, 9. waqihimus…","ti":"Rabbana dua #35","mn":"Our Lord, and admit them to gardens of perpetual residence which You have promised them and whoever was righteous among their forefathers, their spouses and their offspring. Indeed, it is You who is…","pu":"A du’a asking to unite the believers with their descendants in Jannah (i.e., to be reunited with your forefathers, spouses, and children.) This du’a also calls upon Allah (swt) using his rightful…","ref":"40:8-9","cat":"C05","bk":"40 Rabbana duas","v":10336,"pend":false},{"id":"R36","ar":"وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ","tl":"Rabbanagh fir lanaa wa li ikhwaani nal lazeena sabqoonaa bil eemaani wa laa taj’al fee quloobinaa ghillalil lazeena aamanoo","ti":"Rabbana dua #36","mn":"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed.","pu":"A du’a which reflects the attitude we should have for our fellow Muslim brothers and sisters. Those who “preceded us in faith” would refer to those who embraced Islam before the emigration from…","ref":"59:10","cat":"C04","bk":"40 Rabbana duas","v":8359,"pend":false},{"id":"R37","ar":"وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ","tl":"Rabbannaaa innaka Ra’oofur Raheem","ti":"Rabbana dua #37","mn":"Our Lord, indeed You are Kind and Merciful.","pu":"A du’a of praise using two of Allah’s rightful names and attributes. The first being Ar-Ra’uf meaning the benign one, the one who is extremely kind and compassionate. The second being Ar-Raheem…","ref":"59:10","cat":"C12","bk":"40 Rabbana duas","v":8359,"pend":false},{"id":"R38","ar":"قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ","tl":"Rabbanaa ‘alaika tawakkalnaa wa ilaika anabnaa wa ilaikal maseer","ti":"Rabbana dua #38","mn":"Our Lord, upon You we have relied, and to You we have returned, and to You is the destination.","pu":"We must show complete trust and reliance in Allah (swt) for all matters. This du’a is one that affirms that we have relied on Him alone. Furthermore, it is also a prayer of remembrance that this…","ref":"60:4","cat":"C08","bk":"40 Rabbana duas","v":12657,"pend":false},{"id":"R39","ar":"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ وَٱغْفِرْ لَنَا رَبَّنَآ ۖ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ","tl":"Rabbana laa taj’alnaa fitnatal lillazeena kafaroo waghfir lanaa rabbanaaa innaka antal azeezul hakeem","ti":"Rabbana dua #39","mn":"Our Lord, make us not [objects of] torment for the disbelievers and forgive us, our Lord. Indeed, it is You who is the Exalted in Might, the Wise.","pu":"Du’a of Prophet Ibrahim (as). This is a du’a Prophet Ibrahim (as) recited asking to make the believers victorious over the disbelievers. To not make us “objects of torment” meaning if the…","ref":"60:5","cat":"C13","bk":"40 Rabbana duas","v":4877,"pend":false},{"id":"R40","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ تُوبُوٓا۟ إِلَى ٱللَّهِ تَوْبَةًۭ نَّصُوحًا عَسَىٰ رَبُّكُمْ أَن يُكَفِّرَ عَنكُمْ سَيِّـَٔاتِكُمْ وَيُدْخِلَكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ يَوْمَ لَا يُخْزِى ٱللَّهُ ٱلنَّبِىَّ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ ۖ نُورُهُمْ يَسْعَىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَٰنِهِمْ يَقُولُونَ رَبَّنَآ أَتْمِمْ لَنَا نُورَنَا وَٱغْفِرْ لَنَآ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ","tl":"Rabbanaaa atmim lanaa nooranaa waghfir lana innaka ‘alaa kulli shai’in qadeer","ti":"Rabbana dua #40","mn":"Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent.","pu":"Another beautiful du’a asking for Jannah. We learn in Surah Al-Hadid verse 12 how on the day of judgment the believing men and women will have a light illuminating from their right hands. They will…","ref":"66:8","cat":"C05","bk":"40 Rabbana duas","v":12614,"pend":false}],L={"en":{"lab":"English","dir":"ltr","eye":"Baba Ji · abjad, QR and the text library","h1":"Abjad Calculator & QR Generator","sub":"Type in Arabic or Urdu, or pick from the library below. You get the Eastern Abjad (ḥisāb al-jumal) value and a QR code — live.","noteT":"What to check.","note":"Every Arabic spelling here came either from a canonical source or from reading the printed page directly, and every number was recalculated from the Arabic when this page was built. Please tell us if any text or any number looks wrong.","pendNote":"Items marked “awaiting your ruling” were deliberately left without a number until you decide. They are listed so you can see exactly what is outstanding.","t1":"The ninety-nine names","t2":"Duas, adhkar &amp; ruqyah","ph":"Search by benefit, meaning or reference — try protection, forgiveness, morning","texts":"texts","match1":"text matches","matchN":"texts match","none":"Nothing matches that. Try a broader word.","pendTag":"awaiting your ruling","abjadLab":"abjad value","emptySel":"Nothing selected yet.","nothing":"nothing selected","item1":"1 item selected","itemN":"items selected","clear":"Clear selection","qrIdle":"Select something","qrOk":"Contains the text and its value","qrErr":"Text too long for one QR code","foot":"Eastern abjad, hisab al-jummal — alif is 1 through ghain is 1000. Spaces and vowel marks carry no value and cannot change a total; only the letters themselves count. Selecting several texts gives the same total whether you add each value separately or calculate the joined text.","tnote":"","docTitle":"Baba Ji — Abjad Calculator, QR & Text Library","inH":"Input · اِندراج","inHint":"Type with your keyboard, or use the on-screen keys below.","btnClear":"Clear","btnKb":"⌨ Keyboard","qrH":"QR Code","btnDl":"Download PNG","btnCopy":"Copy payload","copied":"Copied!","copyFail":"Copy failed — payload:","qrWhat":"What's inside the QR?","qrWhatP":"The QR encodes the exact text you typed followed by its Abjad grand total, e.g.","qrIdleCalc":"Type text to generate a QR code.","qrEnc":"Encodes your text +","abjadWord":"Abjad","qrErrCalc":"QR error: ","abjadH":"Eastern Abjad · حِساب الجُمَّل","grandLab":"Grand total (Alif=1 … Ghain=1000). Spaces & diacritics ignored.","wordLab":"Word-by-word breakdown","letterLab":"Letter-by-letter","refSum":"Abjad value table (Mashriqī / Eastern order)","thWord":"Word","thLetters":"Letters × values","thSum":"Sum","grandRow":"GRAND TOTAL →","emptyRow":"Type something to see the breakdown…","libH":"Text library · pick instead of typing","libSub":"Tap anything to add it to the selection. Tap again to remove it. You can mix names and verses freely, then send the selection to the calculator above.","sendBtn":"Send to calculator","sentMsg":"Sent — the total and the QR above have updated.","selLab":"Current selection","oneEngine":"The library only picks text. Every number on this page is calculated once, by /* ---------- Rendering (calculator) ---------- */
const $ = id => document.getElementById(id);
const ta = $("text");

function render(){
  const text = ta.value;
  const r = analyze(text);
  const t = T();

  $("grand").textContent = r.grand.toLocaleString();

  // word table
  const tb = $("wordTable").querySelector("tbody");
  if(r.words.length===0){
    tb.innerHTML = '<tr><td class="empty" colspan="3">'+escapeHtml(t.emptyRow)+'</td></tr>';
  } else {
    let rows = '<tr><th>'+escapeHtml(t.thWord)+'</th><th>'+escapeHtml(t.thLetters)+'</th><th>'+escapeHtml(t.thSum)+'</th></tr>';
    for(const w of r.words){
      const detail = w.letters
        .filter(l=>!l.ignored)
        .map(l=>`${l.ch}=${l.val}`).join(" + ") || "—";
      rows += `<tr class="wordrow"><td class="ar">${escapeHtml(w.raw)}</td>`+
              `<td class="muted" style="direction:rtl">${escapeHtml(detail)}</td>`+
              `<td class="sub val">${w.sum}</td></tr>`;
    }
    rows += `<tr><td></td><td style="text-align:end" class="muted">${escapeHtml(t.grandRow)}</td>`+
            `<td class="sub" style="color:var(--accent2);font-size:1.1rem">${r.grand}</td></tr>`;
    tb.innerHTML = rows;
  }

  // letter chips
  const chips = r.letters.map(l=>{
    if(l.ignored) return `<div class="lchip ign"><span class="l">${escapeHtml(l.ch)}</span><span class="v">—</span></div>`;
    return `<div class="lchip"><span class="l">${escapeHtml(l.ch)}</span><span class="v">${l.val}</span></div>`;
  }).join("");
  $("letterChips").innerHTML = chips || '<span class="muted">—</span>';

  // QR: text + Abjad total
  const payload = text.trim().length
    ? `${text.trim()}\nAbjad: ${r.grand}`
    : "";
  drawQR(payload, r.grand);
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function esc(s){ return escapeHtml(String(s==null?"":s)); }

/* ---------- QR ---------- */
let lastPayload = "";
function drawQR(payload, total){
  const canvas = $("qrcanvas");
  const t = T();
  lastPayload = payload;
  if(!payload){
    const ctx = canvas.getContext("2d");
    canvas.width = canvas.height = 220;
    ctx.clearRect(0,0,220,220);
    $("qrmeta").textContent = t.qrIdleCalc;
    return;
  }
  QRCode.toCanvas(canvas, payload, {width:220, margin:1, errorCorrectionLevel:"M"}, err=>{
    if(err){ $("qrmeta").textContent = t.qrErrCalc+err; return; }
    $("qrmeta").innerHTML = escapeHtml(t.qrEnc)+' <b>'+escapeHtml(t.abjadWord)+': '+total+'</b>';
  });
}

/* ---------- Reference table ---------- */
(function refTable(){
  const order = ["ا","ب","ج","د","ه","و","ز","ح","ط","ي","ك","ل","م","ن","س","ع","ف","ص","ق","ر","ش","ت","ث","خ","ذ","ض","ظ","غ"];
  $("refChips").innerHTML = order.map(l=>
    `<div class="lchip"><span class="l">${l}</span><span class="v">${ABJAD[l]}</span></div>`).join("");
})();

/* ---------- On-screen keyboard ---------- */
const KB_ROWS = [
  ["ا","ب","ج","د","ه","و","ز","ح","ط","ي"],
  ["ك","ل","م","ن","س","ع","ف","ص","ق","ر"],
  ["ش","ت","ث","خ","ذ","ض","ظ","غ","ء","ة"],
  ["پ","چ","ٹ","ڈ","ڑ","ژ","گ","ک","ں","ہ"],
  ["ی","ے","آ","أ","ؤ","ئ","ﷲ"]
];

(function buildKB(){
  const kb = $("keyboard");
  let html = "";
  for(const row of KB_ROWS){
    html += '<div class="krow">'+row.map(k=>`<button class="key" type="button" data-k="${k}">${k}</button>`).join("")+'</div>';
  }
  html += '<div class="krow">'+
    '<button class="key wide" type="button" data-k=" ">Space</button>'+
    '<button class="key wide" type="button" id="bksp">⌫ Back</button>'+
    '</div>';
  kb.innerHTML = html;
  kb.addEventListener("click",e=>{
    const b = e.target.closest("button"); if(!b) return;
    if(b.id==="bksp"){ ta.value = ta.value.slice(0,-1); }
    else if(b.dataset.k!==undefined){ insertAtCursor(ta, b.dataset.k); }
    ta.focus(); render();
  });
})();

function insertAtCursor(el, str){
  const s = el.selectionStart ?? el.value.length;
  const e = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,s) + str + el.value.slice(e);
  const pos = s + str.length;
  el.setSelectionRange(pos,pos);
}
